name: Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r code/requirements.txt pyinstaller

      - name: Build Qt compatibility DLLs
        working-directory: code
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSDIR=%%i"
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat"
          python wincompat\prepare.py
          if errorlevel 1 exit /b 1

      - name: Build exe
        working-directory: code
        run: pyinstaller --noconfirm --clean app.spec

      - name: Check required Qt libraries are packed
        working-directory: code
        run: python check_bundle.py

      - uses: actions/upload-artifact@v4
        with:
          name: 黄金万两-v1.0.0-windows
          path: code/dist/黄金万两.exe
          if-no-files-found: error
