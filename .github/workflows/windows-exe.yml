name: Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r code/requirements.txt pyinstaller

      - name: Build exe
        working-directory: code
        run: pyinstaller --noconfirm --clean app.spec

      - name: Check required Qt libraries are packed
        working-directory: code
        run: python -c "from PyInstaller.archive.readers import CArchiveReader; names=[n.replace(chr(92),'/').lower() for n in CArchiveReader('dist/黄金万两.exe').toc]; required=('qt6core','qt6gui','qt6widgets','vcruntime140','qwindows'); missing=[t for t in required if not any(t in n for n in names)]; assert not missing, missing; assert not any('webengine' in n for n in names); print('dlls', sum(n.endswith('.dll') for n in names))"

      - uses: actions/upload-artifact@v4
        with:
          name: 黄金万两-v1.0.0-windows
          path: code/dist/黄金万两.exe
          if-no-files-found: error
